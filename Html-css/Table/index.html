<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Tiền</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Mỳ gói</td>
          <td>3 000đ</td>
        </tr>

        <tr>
          <td>Rau</td>
          <td>5 000đ</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Tổng</td>
          <td>8 000đ</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
